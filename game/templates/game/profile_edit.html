{% extends 'game/base.html' %}
{% block title %}Edit profile · Mafia Night{% endblock %}
{% block content %}
<form method="post" class="panel" style="max-width:560px;margin:1rem auto">{% csrf_token %}
  <h1 style="font-size:2rem">Your profile</h1>
  {{ form.as_p }}
  <div class="row"><button class="gold">Save</button><a class="btn ghost" href="{% url 'profile' user.get_username %}">Cancel</a></div>
</form>
{% endblock %}
